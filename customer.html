<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>My Servers · Nexus Panel"><link rel="stylesheet" href="styles.css"><style>
body{background:#07111f;color:#eaf3ff}.portal{max-width:1100px;margin:auto;padding:22px}.portal-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:12px 0 28px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#52b8ff,#5965ff);font-size:22px}.muted{color:#91a7c1}.server-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.server{border:1px solid #25425f;border-radius:16px;padding:18px;background:linear-gradient(150deg,#10233a,#0a1625);min-width:0}.server h2{margin:8px 0;font-size:19px}.server p{color:#91a7c1;font-size:13px}.address{padding:12px;border-radius:10px;background:#071320;border:1px solid #244766;overflow-wrap:anywhere}.address strong{display:block;color:#7ce8b2;margin:5px 0 10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button,.address button{border:1px solid #31577a;background:#112942;color:#c7e5ff;border-radius:8px;padding:9px 12px;cursor:pointer}.actions button.primary{background:#2875d9;border-color:#398cf3;color:white}.actions button:disabled{opacity:.45;cursor:not-allowed}.status{font-size:12px;color:#a6bbd1}.status.online{color:#7ce8b2}.empty{border:1px dashed #31506e;border-radius:16px;padding:35px;text-align:center;color:#91a7c1}.console{width:100%;height:180px;box-sizing:border-box;background:#020912;color:#b9f7d3;border:1px solid #20364e;border-radius:10px;padding:10px;margin-top:12px;white-space:pre-wrap;overflow:auto}.command{display:flex;gap:8px;margin-top:8px}.command input{flex:1;min-width:0;background:#07111f;border:1px solid #29445e;color:#fff;border-radius:8px;padding:10px}.message{color:#ffbdc7;min-height:20px;font-size:13px}@media(max-width:520px){.portal{padding:14px}.server{padding:14px}}
</style></head><body><main class="portal"><header class="portal-head"><div class="brand"><div class="brand-mark">✦</div><div><strong>NEXUS PANEL</strong><div class="muted">Customer hosting portal</div></div></div><div><span class="muted" id="welcome">Loading account…</span> <button class="button secondary" id="changePassword">Change password</button> <button class="button secondary" id="logout">Sign out</button></div></header><section><div class="eyebrow"><i></i> YOUR HOSTING</div><h1>My game servers</h1><p class="muted">Manage your assigned servers, copy their join address, and view live status.</p><div id="message" class="message" role="status"></div><div id="servers" class="server-grid"><div class="empty">Loading your servers…</div></div></section><section style="margin-top:32px"><h2>Invoices & billing</h2><p class="muted">View invoices linked to your account. Online payment is not enabled in this version.</p><div id="invoices" class="server-grid"><div class="empty">Loading invoices…</div></div></section></main><script>
const $=s=>document.querySelector(s);let csrf="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path,options={}){const method=(options.method||"GET").toUpperCase();const headers={"Content-Type":"application/json",...(options.headers||{})};if(["POST","PUT","PATCH","DELETE"].includes(method))headers["X-Nexus-CSRF"]=csrf;const r=await fetch(path,{...options,method,headers,credentials:"same-origin"});const d=await r.json().catch(()=>({ok:false,error:"Invalid server response"}));if(r.status===401){location.replace("/login.html");throw Error("Please sign in again.")}if(!r.ok||d.ok===false)throw Error(d.error||"Request failed");return d}
function msg(s){$("#message").textContent=s||""}
async function refresh(){const d=await api("/api/servers");if(!d.items.length){$("#servers").innerHTML='<div class="empty">No game servers have been assigned to this account yet. Contact your hosting provider.</div>';return}$("#servers").innerHTML=d.items.map(s=>'<article class="server managed-server" data-server="'+esc(s.id)+'"><div class="status" data-live>Checking status…</div><h2>'+esc(s.name)+'</h2><p>'+esc(s.game)+' · '+esc(s.panel)+'</p><div class="address"><span class="muted">JAVA EDITION JOIN ADDRESS</span><strong>'+esc(s.connect_address||"Not available")+'</strong>'+(s.connect_address?'<button data-copy="'+esc(s.connect_address)+'">Copy address</button>':'')+'<p class="muted">'+(s.public_address_configured?"Public host configured":"Local-only address; the provider must configure public network access")+'</p></div><div class="actions"><button class="primary" data-action="start">Start</button><button data-action="restart">Restart</button><button data-action="stop">Stop</button><button data-action="console">Refresh console</button></div><pre class="console" data-console>Console output loads on request.</pre><form class="command"><input maxlength="1000" placeholder="Minecraft console command" aria-label="Console command" required><button>Send</button></form></article>').join("");for(const s of d.items)updateStatus(s.id); }
async function updateStatus(id){const card=document.querySelector('[data-server="'+CSS.escape(id)+'"]');if(!card)return;const label=card.querySelector("[data-live]");try{const d=await api("/api/servers/"+encodeURIComponent(id)+"/game-status");label.textContent=d.online?"Online · "+d.players+"/"+d.max_players+" players · "+(d.version||"Minecraft"):"Offline";label.className="status"+(d.online?" online":"")}catch(e){label.textContent="Status unavailable"}}
$("#servers").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;const card=b.closest("[data-server]");if(!card)return;const id=card.dataset.server;msg("");try{if(b.dataset.copy){await navigator.clipboard.writeText(b.dataset.copy);msg("Join address copied.");return}if(b.dataset.action==="console"){const d=await api("/api/servers/"+encodeURIComponent(id)+"/console");card.querySelector("[data-console]").textContent=(d.logs||[]).map(x=>"["+x.time+"] "+x.text).join("\n")||"No console output yet.";await updateStatus(id);return}const d=await api("/api/servers/"+encodeURIComponent(id)+"/"+b.dataset.action,{method:"POST",body:JSON.stringify({})});msg(b.dataset.action+" request sent.");if(d.logs)card.querySelector("[data-console]").textContent=d.logs.map(x=>x.text).join("\n");setTimeout(()=>updateStatus(id),1200)}catch(e){msg(e.message)}});
$("#servers").addEventListener("submit",async e=>{if(!e.target.matches(".command"))return;e.preventDefault();const card=e.target.closest("[data-server]");try{await api("/api/servers/"+encodeURIComponent(card.dataset.server)+"/command",{method:"POST",body:JSON.stringify({command:e.target.querySelector("input").value})});e.target.reset();const d=await api("/api/servers/"+encodeURIComponent(card.dataset.server)+"/console");card.querySelector("[data-console]").textContent=(d.logs||[]).map(x=>"["+x.time+"] "+x.text).join("\n")}catch(err){msg(err.message)}});
async function loadInvoices(){const root=$("#invoices");try{const d=await api("/api/customer/invoices");const items=d.items||[];root.innerHTML=items.length?items.map(i=>'<article class="server"><div class="status">'+esc(i.status.toUpperCase())+'</div><h2>'+esc(i.invoice_number)+'</h2><p>'+esc(i.plan_name)+'</p><div class="address"><strong>'+esc(i.currency)+' '+(Number(i.amount_minor)/100).toFixed(2)+'</strong><p class="muted">Created '+esc(new Date(i.created_at).toLocaleDateString())+' · Due '+esc(new Date(i.due_at).toLocaleDateString())+'</p>'+(i.paid_at?'<p class="muted">Paid '+esc(new Date(i.paid_at).toLocaleDateString())+'</p>':'<p class="muted">Please contact your hosting provider to arrange payment.</p>')+'</div></article>').join(""):'<div class="empty">No invoices are linked to this account yet.</div>'}catch(e){root.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
$("#changePassword").onclick=async()=>{const current_password=prompt("Enter your current password");if(current_password===null)return;const new_password=prompt("Choose a new password (at least 12 characters)");if(new_password===null)return;try{await api("/api/auth/change-password",{method:"POST",body:JSON.stringify({current_password,new_password})});msg("Password updated. Other sessions were signed out.");}catch(e){msg(e.message)}};
$("#logout").onclick=async()=>{try{await api("/api/auth/logout",{method:"POST",body:JSON.stringify({})})}finally{location.replace("/login.html")}};
(async()=>{try{const s=await api("/api/auth/session");if(!s.authenticated) return location.replace("/login.html");if(s.role!=="customer")return location.replace("/index.html");csrf=s.csrf_token;$("#welcome").textContent="Signed in as "+s.username;await refresh();await loadInvoices()}catch(e){msg(e.message)}})();
</script><script src="runtime-ui.js"></script></body></html>
