<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Sign in · Nexus Panel</title><link rel="stylesheet" href="styles.css"><style>
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at top,#122e4e 0%,#07111f 55%)}.auth-card{width:min(440px,100%);background:#0d1a2b;border:1px solid #25415f;border-radius:22px;padding:clamp(22px,5vw,38px);box-shadow:0 24px 80px #0007}.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:30px}.auth-brand .brand-icon{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,#58b8ff,#3966ff);font-size:24px}.auth-brand strong{display:block;letter-spacing:3px}.auth-brand small{display:block;color:#8b9cb2;letter-spacing:4px}.auth-card h1{font-size:30px;margin:8px 0}.auth-card p{color:#9db0c7;line-height:1.6}.auth-card label{display:block;margin:20px 0 8px;color:#dce9f8}.auth-card input{box-sizing:border-box;width:100%;padding:13px 14px;border:1px solid #29435e;border-radius:10px;background:#081422;color:#edf5ff}.auth-card input:focus{outline:1px solid #4c9dff}.auth-card button{width:100%;margin-top:24px}.auth-status{min-height:22px;margin-top:15px;font-size:13px;color:#ff9fae}.auth-foot{font-size:12px;color:#7288a1;margin-top:22px}
</style></head><body><main class="auth-wrap"><section class="auth-card"><div class="auth-brand"><div class="brand-icon">✦</div><div><strong>NEXUS</strong><small>PANEL</small></div></div><div class="eyebrow"><i></i> SECURE ACCOUNT ACCESS</div><h1>Welcome back.</h1><p>Sign in to manage your Nexus game hosting workspace.</p><form id="loginForm"><label for="username">Username</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="button primary" id="loginButton" type="submit">Sign in to Nexus →</button><div class="auth-status" id="status" role="status"></div></form><div class="auth-foot">Secure account login · Session expires after 12 hours · Keep the panel port private until deployment hardening is complete.</div></section></main><script>
const $=id=>document.getElementById(id);async function call(path,options={}){const r=await fetch(path,{credentials:"same-origin",...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});const d=await r.json().catch(()=>({ok:false,error:"Invalid response"}));if(!r.ok||d.ok===false)throw Error(d.error||"Request failed");return d}
(async()=>{try{const s=await call("/api/auth/session");if(s.authenticated)location.replace(s.role==="customer"?"/customer.html":"/index.html");else{$("username").focus()}}catch(e){$("status").textContent=e.message}})();
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();const b=$("loginButton");b.disabled=true;b.textContent="Signing in…";$("status").textContent="";try{await call("/api/auth/login",{method:"POST",body:JSON.stringify({username:$("username").value.trim(),password:$("password").value})});const session=await call("/api/auth/session");location.replace(session.role==="customer"?"/customer.html":"/index.html")}catch(err){$("status").textContent=err.message;$("password").value="";}finally{b.disabled=false;b.textContent="Sign in to Nexus →"}});
</script></body></html>
